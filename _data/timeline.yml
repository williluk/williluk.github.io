- title: Research Assistant, Extended Reality Laboratory
  from: 2024
  to: 2025
  description: I worked at OSU's Extended Reality Laboratory, developing VR/XR software to explore how interactivity and
    immersion can make our technology more accessible, usable, and learnable. I worked on many projects on the
    cutting edge, including a VR training simulator for pilots of tree harvesters, an AR tool providing AI-based
    navigation and task guidance, and a web game to teach students about microelectronics (which I lead). My
    work contributed to over 5 research papers or master's theses, including one I co-authored which was accepted into Springer-Nature Computer Science.

